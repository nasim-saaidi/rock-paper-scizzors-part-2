<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock papers scizzors</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>

    <div class="text-center ">
        <h3>Rock papers scizzors </h3>
        <div class="result"></div>
        
    </div>

    <div class="d-flex justify-content-center">
        <div class="mainBoard">
            <div class="container">
                <div class="row">
                    <div class="col playerbox">

                        
                        <div class="player rlPlayer">

                        </div>

                        <h4 class="playerName"></h4>
                        <h3 class="playerPoints">1</h3>
                    </div>
                    <div class="col playerbox">
                        
                        <div class="player bot">

                        </div>
                        <h4><b>bot</b></h4>
                        <h3 class="botPoints">1</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-center mt-4">
        <button>confirm</button>
    </div>
    <div class="buttons">
        <div class="choiceBoard row">

            <div class="col cover">
                <div class="choice rock">
                    <img src="/img/rock.png">
                </div>
            </div>

            <div class="col cover">
                <div class="choice paper">
                    <img src="/img/paper.png">
                </div>
            </div>

            <div class="col cover">
                <div class="choice scizzor">
                    <img src="/img/scizor.jpg">
                </div>
            </div>
        </div>
    </div>

    <script type="application/javascript" src="/js/main.js"></script>


</body>

</html>
